AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Weather API on AWS Lambda

Resources:
  WeatherApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/lambda.handler
      Runtime: nodejs20.x
      MemorySize: 512
      Timeout: 10
      # Environment:
      #   Variables:
      #     REDIS_URL: redis://your-redis-host:6379
      #     CACHE_TTL_MS: 300000
      #     MAX_CACHE_SIZE: 3
      #     RATE_LIMIT_WINDOW_SECONDS: 60
      #     RATE_LIMIT_MAX_REQUESTS: 5
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            Path: /{proxy+}
            Method: ANY
